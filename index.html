<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción de Material Servicios Muñoz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container" id="loginScreen">

        <section class="login-box">

            <img
                src="logo.jpg"
                alt="Servicios Muñoz"
                class="logo"
            >

            <h1>RECEPCIÓN DE MATERIAL</h1>
            <h2>SERVICIOS MUÑOZ</h2>

            <div class="login-form">

                <label for="usuario">Usuario</label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Introduce tu usuario"
                    autocomplete="username"
                >

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Introduce tu contraseña"
                    autocomplete="current-password"
                >

                <button id="loginButton">
                    INICIAR SESIÓN
                </button>

                <p id="mensaje"></p>

            </div>

        </section>

    </main>

    <main class="app-container" id="appScreen" style="display: none;">

        <header class="app-header">

            <div class="app-brand">
                <img src="logo.jpg" alt="Servicios Muñoz">

                <div>
                    <h1>RECEPCIÓN DE MATERIAL</h1>
                    <p>SERVICIOS MUÑOZ</p>
                </div>
            </div>

            <div class="user-area">
                <span id="usuarioActivo"></span>
                <button id="logoutButton">CERRAR SESIÓN</button>
            </div>

        </header>

        <section class="dashboard" id="dashboardScreen">

            <div class="dashboard-header">
                <h2>Panel principal</h2>
                <p>Gestión de recepción y reparación de material</p>
            </div>

            <div class="dashboard-grid">

                <button class="dashboard-card" id="nuevaRecepcion">
                    <strong>NUEVA RECEPCIÓN</strong>
                    <span>Registrar material recibido</span>
                </button>

                <button class="dashboard-card">
                    <strong>REPARACIONES</strong>
                    <span>Consultar y gestionar reparaciones</span>
                </button>

                <button class="dashboard-card">
                    <strong>PRESUPUESTOS</strong>
                    <span>Consultar y gestionar presupuestos</span>
                </button>

                <button class="dashboard-card">
                    <strong>CLIENTES</strong>
                    <span>Consultar clientes</span>
                </button>

                <button class="dashboard-card">
                    <strong>BUSCAR</strong>
                    <span>Buscar reparaciones y materiales</span>
                </button>

                <button class="dashboard-card" id="administracion">
                    <strong>ADMINISTRACIÓN</strong>
                    <span>Usuarios y configuración</span>
                </button>

            </div>

        </section>

        <section class="reception-screen" id="receptionScreen" style="display: none;">

            <div class="page-header">

                <div>
                    <h2>Nueva recepción</h2>
                    <p>Registrar material recibido para reparación</p>
                </div>

                <button id="volverDashboard">
                    VOLVER
                </button>

            </div>

            <form id="receptionForm">

                <div class="form-section">

                    <h3>Datos de la recepción</h3>

                    <div class="form-grid">

                        <div class="form-field">
                            <label for="numeroReparacion">Número de reparación</label>
                            <input
                                type="text"
                                id="numeroReparacion"
                                readonly
                            >
                        </div>

                        <div class="form-field">
                            <label for="fechaRecepcion">Fecha y hora</label>
                            <input
                                type="datetime-local"
                                id="fechaRecepcion"
                                readonly
                            >
                        </div>

                        <div class="form-field">
                            <label for="cliente">Cliente</label>
                            <input
                                type="text"
                                id="cliente"
                                placeholder="Nombre del cliente"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="telefono">Teléfono</label>
                            <input
                                type="tel"
                                id="telefono"
                                placeholder="Teléfono del cliente"
                            >
                        </div>

                    </div>

                </div>

                <div class="form-section">

                    <h3>Material recibido</h3>

                    <div class="form-grid">

                        <div class="form-field">
                            <label for="marca">Marca</label>
                            <input
                                type="text"
                                id="marca"
                                placeholder="Marca"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="modelo">Modelo</label>
                            <input
                                type="text"
                                id="modelo"
                                placeholder="Modelo"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="numeroSerie">Número de serie</label>
                            <input
                                type="text"
                                id="numeroSerie"
                                placeholder="Número de serie"
                            >
                        </div>

                        <div class="form-field">
                            <label for="tipoMaterial">Tipo de material</label>
                            <input
                                type="text"
                                id="tipoMaterial"
                                placeholder="Ej. Taladro, generador, motosierra..."
                                required
                            >
                        </div>

                    </div>

                    <div class="form-field full-width">
                        <label for="accesorios">Accesorios entregados</label>
                        <textarea
                            id="accesorios"
                            placeholder="Describe los accesorios entregados"
                        ></textarea>
                    </div>

                    <div class="form-field full-width">
                        <label for="estadoRecepcion">Estado del material al recibirlo</label>
                        <textarea
                            id="estadoRecepcion"
                            placeholder="Describe el estado exterior, golpes, daños, piezas faltantes..."
                        ></textarea>
                    </div>

                    <div class="form-field full-width">
                        <label for="averia">Avería indicada por el cliente</label>
                        <textarea
                            id="averia"
                            placeholder="Describe el problema indicado por el cliente"
                            required
                        ></textarea>
                    </div>

                    <div class="form-field full-width">
                        <label for="observaciones">Observaciones</label>
                        <textarea
                            id="observaciones"
                            placeholder="Observaciones adicionales"
                        ></textarea>
                    </div>

                </div>

                <div class="form-section">

                    <h3>Fotografías</h3>

                    <div class="form-field full-width">
                        <label for="fotos">Añadir fotografías del material</label>
                        <input
                            type="file"
                            id="fotos"
                            accept="image/*"
                            multiple
                        >
                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelarRecepcion"
                        class="secondary-button"
                    >
                        CANCELAR
                    </button>

                    <button
                        type="submit"
                        id="guardarRecepcion"
                        class="primary-button"
                    >
                        GUARDAR RECEPCIÓN
                    </button>

                </div>

                <p id="mensajeRecepcion"></p>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
